<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Connection Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Supabase Connection Test</h1>
        
        <div class="space-y-4">
            <!-- Connection Test -->
            <div class="p-4 border rounded">
                <h2 class="font-semibold mb-2">1. Connection Test</h2>
                <button id="testConnection" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Test Connection
                </button>
                <div id="connectionResult" class="mt-2 p-2 rounded hidden"></div>
            </div>

            <!-- Authentication Test -->
            <div class="p-4 border rounded">
                <h2 class="font-semibold mb-2">2. Authentication Test</h2>
                <div class="space-y-2">
                    <input type="email" id="testEmail" placeholder="test@example.com" class="w-full p-2 border rounded">
                    <input type="password" id="testPassword" placeholder="password123" class="w-full p-2 border rounded">
                    <div class="space-x-2">
                        <button id="testSignUp" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                            Test Sign Up
                        </button>
                        <button id="testSignIn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                            Test Sign In
                        </button>
                        <button id="testSignOut" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                            Test Sign Out
                        </button>
                    </div>
                </div>
                <div id="authResult" class="mt-2 p-2 rounded hidden"></div>
            </div>

            <!-- Database Test -->
            <div class="p-4 border rounded">
                <h2 class="font-semibold mb-2">3. Database Test</h2>
                <div class="space-y-2">
                    <input type="text" id="testTitle" placeholder="Test Entry Title" class="w-full p-2 border rounded">
                    <textarea id="testContent" placeholder="Test entry content..." class="w-full p-2 border rounded h-20"></textarea>
                    <div class="space-x-2">
                        <button id="testCreateEntry" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                            Test Create Entry
                        </button>
                        <button id="testGetEntries" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">
                            Test Get Entries
                        </button>
                    </div>
                </div>
                <div id="databaseResult" class="mt-2 p-2 rounded hidden"></div>
            </div>

            <!-- Current Status -->
            <div class="p-4 border rounded bg-gray-50">
                <h2 class="font-semibold mb-2">Current Status</h2>
                <div id="currentStatus" class="text-sm">
                    <p>User: <span id="currentUser">Not authenticated</span></p>
                    <p>Connection: <span id="connectionStatus">Not tested</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Import our Supabase services -->
    <script type="module">
        import authService from './js/supabase-auth-service.js';
        import databaseService from './js/supabase-database-service.js';
        import { supabase } from './js/supabase-config.js';

        // Helper function to show results
        function showResult(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.className = `mt-2 p-2 rounded ${isError ? 'bg-red-100 text-red-700 border border-red-300' : 'bg-green-100 text-green-700 border border-green-300'}`;
            element.textContent = message;
            element.classList.remove('hidden');
        }

        // Update current status
        function updateStatus() {
            authService.getUser().then(user => {
                document.getElementById('currentUser').textContent = user ? `${user.email} (${user.id.substring(0, 8)}...)` : 'Not authenticated';
            });
        }

        // Test connection
        document.getElementById('testConnection').addEventListener('click', async () => {
            try {
                // Test basic Supabase connection by querying auth users table
                const { data, error } = await supabase.auth.getSession();
                
                if (error && error.message.includes('connection')) {
                    throw new Error('Connection failed');
                }
                
                showResult('connectionResult', '✅ Connection successful! Supabase client is working.');
                document.getElementById('connectionStatus').textContent = 'Connected';
            } catch (error) {
                showResult('connectionResult', `❌ Connection failed: ${error.message}`, true);
                document.getElementById('connectionStatus').textContent = 'Failed';
            }
        });

        // Test sign up
        document.getElementById('testSignUp').addEventListener('click', async () => {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;

            if (!email || !password) {
                showResult('authResult', '❌ Please enter email and password', true);
                return;
            }

            try {
                const result = await authService.signUp(email, password);
                if (result.error) {
                    throw new Error(result.error);
                }
                showResult('authResult', '✅ Sign up successful! Check your email for confirmation.');
                updateStatus();
            } catch (error) {
                showResult('authResult', `❌ Sign up failed: ${error.message}`, true);
            }
        });

        // Test sign in
        document.getElementById('testSignIn').addEventListener('click', async () => {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;

            if (!email || !password) {
                showResult('authResult', '❌ Please enter email and password', true);
                return;
            }

            try {
                const result = await authService.signIn(email, password);
                if (result.error) {
                    throw new Error(result.error);
                }
                showResult('authResult', '✅ Sign in successful!');
                updateStatus();
            } catch (error) {
                showResult('authResult', `❌ Sign in failed: ${error.message}`, true);
            }
        });

        // Test sign out
        document.getElementById('testSignOut').addEventListener('click', async () => {
            try {
                const result = await authService.signOut();
                if (result.error) {
                    throw new Error(result.error);
                }
                showResult('authResult', '✅ Sign out successful!');
                updateStatus();
            } catch (error) {
                showResult('authResult', `❌ Sign out failed: ${error.message}`, true);
            }
        });

        // Test create entry
        document.getElementById('testCreateEntry').addEventListener('click', async () => {
            const title = document.getElementById('testTitle').value;
            const content = document.getElementById('testContent').value;

            if (!title || !content) {
                showResult('databaseResult', '❌ Please enter title and content', true);
                return;
            }

            try {
                const result = await databaseService.createEntry({
                    title: title,
                    content: content,
                    mood: 'testing',
                    themes: ['test', 'migration']
                });

                if (!result.success) {
                    throw new Error(result.error);
                }

                showResult('databaseResult', `✅ Entry created successfully! ID: ${result.data.id.substring(0, 8)}...`);
            } catch (error) {
                showResult('databaseResult', `❌ Create entry failed: ${error.message}`, true);
            }
        });

        // Test get entries
        document.getElementById('testGetEntries').addEventListener('click', async () => {
            try {
                const result = await databaseService.getUserEntries({ limit: 10 });

                if (!result.success) {
                    throw new Error(result.error);
                }

                const count = result.data.length;
                const message = count > 0 
                    ? `✅ Retrieved ${count} entries successfully!`
                    : '✅ No entries found (this is normal for new accounts)';
                
                showResult('databaseResult', message);
            } catch (error) {
                showResult('databaseResult', `❌ Get entries failed: ${error.message}`, true);
            }
        });

        // Initialize status on page load
        updateStatus();

        // Set up auth state listener
        authService.onAuthStateChange((user, event) => {
            console.log('Auth state changed:', event, user?.email);
            updateStatus();
        });

        console.log('🧪 Supabase test page loaded successfully');
        console.log('🔗 Supabase URL:', supabase.supabaseUrl);
        console.log('🔑 Auth service:', authService);
        console.log('💾 Database service:', databaseService);
    </script>
</body>
</html>
